{% extends "survey/base.html" %}
{% block title %}New Survey{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h1 class="h3 mb-4">New Survey</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="{{ form.name.id_for_label }}" class="form-label fw-semibold">Name</label>
        <input type="text" name="{{ form.name.html_name }}"
               id="{{ form.name.id_for_label }}"
               class="form-control {% if form.name.errors %}is-invalid{% endif %}"
               value="{{ form.name.value|default:'' }}">
        {% for error in form.name.errors %}
        <div class="invalid-feedback">{{ error }}</div>
        {% endfor %}
      </div>
      <div class="mb-3">
        <label for="{{ form.description.id_for_label }}" class="form-label fw-semibold">Description</label>
        <textarea name="{{ form.description.html_name }}"
                  id="{{ form.description.id_for_label }}"
                  class="form-control {% if form.description.errors %}is-invalid{% endif %}"
                  rows="3">{{ form.description.value|default:'' }}</textarea>
        {% for error in form.description.errors %}
        <div class="invalid-feedback">{{ error }}</div>
        {% endfor %}
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Create Survey</button>
        <a href="{% url 'manage:survey_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
